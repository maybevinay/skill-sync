server:
  port: ${PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "https://*.onrender.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URI:lb://auth-service}
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/admin/users,/api/admin/users/**,/api/admin/stats,/api/admin/audit-logs
        - id: matching
          uri: ${MATCHING_SERVICE_URI:lb://matching-service}
          predicates:
            - Path=/api/profile/**,/api/skills/**,/api/mentors/**,/api/requests,/api/requests/**,/api/reviews,/api/reviews/**,/api/admin/analytics
        - id: ai
          uri: ${AI_SERVICE_URI:lb://ai-service}
          predicates:
            - Path=/api/chat,/api/chat/**,/api/rag/**,/api/documents/**,/api/admin/ai-stats
skillsync:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-256-bit-secret-key-for-hs256-skillsync}
    issuer: ${JWT_ISSUER:skillsync}
  rate-limit:
    requests-per-minute: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
